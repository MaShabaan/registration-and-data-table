<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home – Registration & Data Table</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, 'Segoe UI', Roboto, sans-serif; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 2rem;
    }
    .container {
      background: white;
      padding: 3rem 2.5rem;
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
      max-width: 600px;
      width: 100%;
      text-align: center;
    }
    h1 {
      color: #1a2639;
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }
    p.welcome {
      color: #6b7a8f;
      margin-bottom: 2.5rem;
      font-size: 1.05rem;
    }
    .links {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .link-card {
      display: block;
      padding: 1.2rem 1.5rem;
      background: #f5f7fc;
      border-radius: 14px;
      text-decoration: none;
      color: #1a2639;
      font-weight: 600;
      font-size: 1.1rem;
      border: 2px solid transparent;
      transition: 0.25s;
      text-align: left;
    }
    .link-card:hover {
      background: #e8edfb;
      border-color: #2a7de1;
      transform: translateY(-3px);
    }
    .link-card span {
      display: block;
      font-size: 0.85rem;
      font-weight: 400;
      color: #6b7a8f;
      margin-top: 0.3rem;
    }
    .badge {
      display: inline-block;
      background: #2a7de1;
      color: white;
      font-size: 0.7rem;
      padding: 0.2rem 0.6rem;
      border-radius: 20px;
      margin-right: 0.5rem;
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📋 My Project</h1>
    <p class="welcome">Choose one of the two parts below to explore:</p>
    <div class="links">
      <a href="validation.html" class="link-card">
        <span class="badge">PART 1</span> Registration Form
        <span>JavaScript validation for name, email, password, confirm password, and age.</span>
      </a>
      <a href="data.html" class="link-card">
        <span class="badge">PART 2</span> Data Table
        <span>Interactive table with live search and sort buttons.</span>
      </a>
    </div>
  </div>
</body>
</html>
